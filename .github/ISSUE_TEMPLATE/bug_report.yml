name: Bug 报告
description: 报告界面、课表导入或协作功能的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: 请使用虚构或匿名化数据。不要上传密码、恢复码、Token、会话或私人课表；安全问题请先阅读 SECURITY.md。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 发生了什么？预期应该怎样？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 使用方式
      options:
        - 官方在线站点
        - 自己部署到 Cloudflare
        - 本地开发
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器、系统与版本
      placeholder: 例如 Chrome / macOS；自部署请附 commit 或版本
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息
      description: 可附已检查隐私的截图、报错或最小虚构 ICS。请勿粘贴完整个人课表或密钥。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已检查内容，不包含密码、恢复码、Token、会话或他人的私人数据。
          required: true
